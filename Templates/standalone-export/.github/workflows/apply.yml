name: Apply

# A merge into main applies the tenants it changed. The pull request review is
# the approval: nothing reaches main without a reviewed plan. One job per
# tenant, in that tenant's GitHub Environment, which only main may use; one run
# per tenant at a time. A merge that removes a tenant's directory (see
# scripts/hand-over.sh) hands the tenant over instead: its state moves to
# handed-over/ on the state branch and its objects stay in Jamf.

on:
  push:
    branches: [main]
    paths: ["tenants/**", "modules/**"]
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant to apply (directory name under tenants/)
        required: true

# Only the jobs that touch the state branch get write.
permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tenants: ${{ steps.manual.outputs.tenants || steps.detect.outputs.tenants }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          TENANT: ${{ inputs.tenant }}
        shell: bash
        run: |
          [[ "$TENANT" =~ ^[a-z0-9][a-z0-9-]*$ ]] && [ -d "tenants/$TENANT" ] || { echo "No tenant named $TENANT"; exit 1; }
          echo "tenants=$(jq -c -n --arg t "$TENANT" '[$t]')" >> "$GITHUB_OUTPUT"
      - id: detect
        if: github.event_name == 'push'
        uses: ./.github/actions/detect-tenants
        with:
          base: ${{ github.event.before }}

  apply:
    permissions:
      contents: write   # the state backend writes state and lock branches
    needs: detect
    if: github.ref == 'refs/heads/main' && needs.detect.outputs.tenants != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJson(needs.detect.outputs.tenants) }}
    environment:
      name: ${{ matrix.tenant }}
    concurrency:
      group: tenant-${{ matrix.tenant }}
      cancel-in-progress: false
    env:
      TENANT: ${{ matrix.tenant }}
      # Credentials from the tenant's Environment: JAMFPLATFORM_* for tenants
      # on the Jamf Platform API, JAMFPRO_* for tenants on the Jamf Pro API.
      # The set a tenant does not use stays empty.
      JAMFPLATFORM_BASE_URL: ${{ vars.JAMFPLATFORM_BASE_URL }}
      JAMFPLATFORM_ENVIRONMENT_ID: ${{ vars.JAMFPLATFORM_ENVIRONMENT_ID }}
      JAMFPLATFORM_TENANT_ID: ${{ vars.JAMFPLATFORM_TENANT_ID }}   # older tenant-scope clients
      JAMFPLATFORM_CLIENT_ID: ${{ secrets.JAMFPLATFORM_CLIENT_ID }}
      JAMFPLATFORM_CLIENT_SECRET: ${{ secrets.JAMFPLATFORM_CLIENT_SECRET }}
      JAMFPRO_INSTANCE_FQDN: ${{ vars.JAMFPRO_INSTANCE_FQDN }}
      JAMFPRO_AUTH_PROVIDER: direct
      JAMFPRO_AUTH_METHOD: ${{ vars.JAMFPRO_AUTH_METHOD }}
      JAMFPRO_CLIENT_ID: ${{ secrets.JAMFPRO_CLIENT_ID }}
      JAMFPRO_CLIENT_SECRET: ${{ secrets.JAMFPRO_CLIENT_SECRET }}
      JAMFPRO_BASIC_USERNAME: ${{ secrets.JAMFPRO_BASIC_USERNAME }}
      JAMFPRO_BASIC_PASSWORD: ${{ secrets.JAMFPRO_BASIC_PASSWORD }}
      # Tenants with Jamf Protect blocks also need these.
      JAMFPROTECT_URL: ${{ vars.JAMFPROTECT_URL }}
      JAMFPROTECT_CLIENT_ID: ${{ secrets.JAMFPROTECT_CLIENT_ID }}
      JAMFPROTECT_CLIENT_SECRET: ${{ secrets.JAMFPROTECT_CLIENT_SECRET }}
      # The Jamf Pro API plugin needs one operation at a time: those tenants
      # set PARALLELISM to 1 in their Environment.
      TF_CLI_ARGS_plan: -parallelism=${{ vars.PARALLELISM || '10' }}
      TF_CLI_ARGS_apply: -parallelism=${{ vars.PARALLELISM || '2' }}
      TF_CLI_ARGS_destroy: -parallelism=${{ vars.PARALLELISM || '2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || 'latest' }}
          terraform_wrapper: false
      - uses: ./.github/actions/state-backend
        with:
          tenant: ${{ env.TENANT }}
      - uses: ./.github/actions/secret-settings
        with:
          secrets: ${{ toJSON(secrets) }}
      - name: Init
        run: terraform -chdir="tenants/$TENANT" init -input=false
      - name: Apply
        run: terraform -chdir="tenants/$TENANT" apply -input=false -no-color -auto-approve -lock-timeout=120s

  hand-over:
    permissions:
      contents: write   # archives state on the state branch
    # Tenants whose directory this push removed: the code no longer manages
    # them. Their state is archived, not deleted, so adding the directory back
    # and restoring the file brings them back under management.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: state-branch-archive
      cancel-in-progress: false
    env:
      BASE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive the state of removed tenants
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE}^{commit}" 2> /dev/null || exit 0
          # --no-renames: a renamed tenant directory is a removal here, never a move.
          # Only tenant-shaped names: anything else would word-split below.
          removed=$(git diff --no-renames --name-only --diff-filter=D "$BASE" HEAD -- 'tenants/*/main.tf' \
            | cut -d/ -f2 | while read -r t; do
              [ -d "tenants/$t" ] && continue
              [[ "$t" =~ ^[a-z0-9][a-z0-9-]*$ ]] && echo "$t" || echo "Skipping $t: not a tenant name" >&2
            done)
          [ -n "$removed" ] || { echo "No tenant was removed."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin terraform-state
            rm -rf "$RUNNER_TEMP/state"; git worktree prune
            git worktree add -q --detach "$RUNNER_TEMP/state" origin/terraform-state
            moved=""
            for t in $removed; do
              if [ -f "$RUNNER_TEMP/state/tenants/$t/terraform.tfstate" ]; then
                mkdir -p "$RUNNER_TEMP/state/handed-over"
                git -C "$RUNNER_TEMP/state" mv "tenants/$t/terraform.tfstate" "handed-over/$t-$(date -u +%Y%m%dT%H%M%SZ).tfstate"
                moved="$moved $t"
              fi
            done
            [ -n "$moved" ] || { echo "No state to archive for:$removed"; exit 0; }
            git -C "$RUNNER_TEMP/state" commit -q -m "Hand over$moved: state archived"
            git -C "$RUNNER_TEMP/state" push -q origin HEAD:terraform-state && { echo "Archived:$moved"; exit 0; }
            echo "The state branch moved on; trying again."
          done
          exit 1
