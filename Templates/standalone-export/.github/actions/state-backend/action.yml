name: State backend
description: >-
  Runs terraform-backend-git on the runner and points Terraform's HTTP backend
  at one tenant's state, stored on a branch of this repository with locking.
  Replace this action (and the backend block in tenants/*/terraform.tf) to use
  another backend such as S3 or HCP Terraform.

inputs:
  tenant:
    description: Tenant directory name under tenants/
    required: true
  state-branch:
    description: Branch that holds every tenant's state
    default: terraform-state
  version:
    description: terraform-backend-git release
    default: "0.1.12"

runs:
  using: composite
  steps:
    - name: Start the state backend
      shell: bash
      env:
        TENANT: ${{ inputs.tenant }}
        STATE_BRANCH: ${{ inputs.state-branch }}
        VERSION: ${{ inputs.version }}
        GIT_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/state-backend"
        mkdir -p "$dir"
        if [ ! -x "$dir/terraform-backend-git" ]; then
          base="https://github.com/plumber-cd/terraform-backend-git/releases/download/v${VERSION}"
          (cd "$dir" \
            && curl -fsSL -O "$base/terraform-backend-git-linux-amd64" \
            && curl -fsSL -O "$base/SHA256SUMS" \
            && grep " terraform-backend-git-linux-amd64$" SHA256SUMS | sha256sum -c - \
            && mv terraform-backend-git-linux-amd64 terraform-backend-git \
            && chmod +x terraform-backend-git)
        fi

        # The state branch is created once, empty, the first time it is needed.
        if ! git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null; then
          tree=$(git mktree < /dev/null)
          commit=$(GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@localhost GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost \
            git commit-tree "$tree" -m "Create the state branch")
          git push origin "$commit:refs/heads/$STATE_BRANCH"
        fi

        password=$(openssl rand -hex 24)
        echo "::add-mask::$password"
        port=6061
        TMPDIR="$dir" GIT_USERNAME=x-access-token GIT_PASSWORD="$GIT_TOKEN" \
          TF_BACKEND_GIT_HTTP_USERNAME=ci TF_BACKEND_GIT_HTTP_PASSWORD="$password" \
          nohup "$dir/terraform-backend-git" --address="127.0.0.1:$port" > "$dir/backend.log" 2>&1 &
        for _ in $(seq 1 50); do
          (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null && break
          sleep 0.2
        done

        address="http://127.0.0.1:$port/?type=git&repository=https://github.com/${GITHUB_REPOSITORY}.git&ref=${STATE_BRANCH}&state=tenants/${TENANT}/terraform.tfstate"
        {
          echo "TF_HTTP_ADDRESS=$address"
          echo "TF_HTTP_LOCK_ADDRESS=$address"
          echo "TF_HTTP_UNLOCK_ADDRESS=$address"
          echo "TF_HTTP_USERNAME=ci"
          echo "TF_HTTP_PASSWORD=$password"
        } >> "$GITHUB_ENV"
