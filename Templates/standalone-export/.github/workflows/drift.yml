name: Check for changes

# Weekly (and on demand): plans every tenant against the live Jamf tenant.
# When something was changed directly in Jamf, an issue titled
# "Changed in Jamf: <tenant>" holds the plan. A person decides what happens:
# keep the change by putting it in code with a pull request, or add the
# "restore-baseline" label to the issue to put the baseline back (restore.yml).
# When a later check finds no changes, the issue is closed.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # the state backend writes lock branches
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tenants: ${{ steps.detect.outputs.tenants }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: ./.github/actions/detect-tenants
        with:
          all: "true"

  check:
    needs: detect
    if: needs.detect.outputs.tenants != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJson(needs.detect.outputs.tenants) }}
    environment:
      name: ${{ matrix.tenant }}
    concurrency:
      group: tenant-${{ matrix.tenant }}
      cancel-in-progress: false
    env:
      JAMFPLATFORM_BASE_URL: ${{ vars.JAMFPLATFORM_BASE_URL }}
      JAMFPLATFORM_ENVIRONMENT_ID: ${{ vars.JAMFPLATFORM_ENVIRONMENT_ID }}
      JAMFPLATFORM_CLIENT_ID: ${{ secrets.JAMFPLATFORM_CLIENT_ID }}
      JAMFPLATFORM_CLIENT_SECRET: ${{ secrets.JAMFPLATFORM_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
      TITLE: "Changed in Jamf: ${{ matrix.tenant }}"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || 'latest' }}
          terraform_wrapper: false
      - uses: ./.github/actions/state-backend
        with:
          tenant: ${{ matrix.tenant }}
      - name: Init
        run: terraform -chdir="tenants/${{ matrix.tenant }}" init -input=false
      - name: Plan
        id: plan
        run: |
          set +e
          terraform -chdir="tenants/${{ matrix.tenant }}" plan -input=false -no-color -detailed-exitcode -lock-timeout=120s \
            > "$RUNNER_TEMP/plan.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/plan.txt"
          # 0: matches the code, 2: changed in Jamf, anything else: the check failed.
          [ "$code" = 0 ] || [ "$code" = 2 ] || exit "$code"
          echo "changed=$([ "$code" = 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue
        if: steps.plan.outputs.changed == 'true'
        run: |
          gh label create drift --color D93F0B --description "Changed in Jamf, outside the code" 2>/dev/null || true
          gh label create restore-baseline --color 0E8A16 --description "Put the baseline back" 2>/dev/null || true
          {
            echo "A check found changes made directly in Jamf for \`${{ matrix.tenant }}\`."
            echo
            echo "- **Keep them:** put the change in code with a pull request."
            echo "- **Undo them:** add the \`restore-baseline\` label to this issue."
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/plan.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --label drift --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$TITLE" --label drift --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Close a resolved issue
        if: steps.plan.outputs.changed == 'false'
        run: |
          number=$(gh issue list --state open --label drift --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The latest check found no changes."
          fi
