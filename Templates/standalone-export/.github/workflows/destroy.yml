name: Destroy tenant

# Manual and deliberate: deletes everything the code manages in one tenant.
# Type the tenant name twice. To stop managing a tenant without deleting its
# objects, remove its directory and its state instead (see README).

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant to destroy (directory name under tenants/)
        required: true
      confirm:
        description: Type the tenant name again to confirm
        required: true

permissions:
  contents: write   # the state backend writes state and lock branches

jobs:
  destroy:
    if: inputs.tenant == inputs.confirm
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.tenant }}
    concurrency:
      group: tenant-${{ inputs.tenant }}
      cancel-in-progress: false
    env:
      TENANT: ${{ inputs.tenant }}
      JAMFPLATFORM_BASE_URL: ${{ vars.JAMFPLATFORM_BASE_URL }}
      JAMFPLATFORM_ENVIRONMENT_ID: ${{ vars.JAMFPLATFORM_ENVIRONMENT_ID }}
      JAMFPLATFORM_CLIENT_ID: ${{ secrets.JAMFPLATFORM_CLIENT_ID }}
      JAMFPLATFORM_CLIENT_SECRET: ${{ secrets.JAMFPLATFORM_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tenant exists
        run: '[ -d "tenants/$TENANT" ] || { echo "No tenant named $TENANT"; exit 1; }'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || 'latest' }}
          terraform_wrapper: false
      - uses: ./.github/actions/state-backend
        with:
          tenant: ${{ env.TENANT }}
      - name: Init
        run: terraform -chdir="tenants/$TENANT" init -input=false
      - name: Destroy
        run: terraform -chdir="tenants/$TENANT" destroy -input=false -no-color -auto-approve -lock-timeout=120s
